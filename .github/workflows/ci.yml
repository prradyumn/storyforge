name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Unit + integration tests (offline stub backend)
        run: pytest -q
      - name: Eval smoke run on stub backend
        run: python eval/run_eval.py --backend stub --prompt-version v3 --out /tmp/eval
