# Render blueprint — free web service, Docker runtime.
# Dashboard → New → Blueprint → pick this repo. You will be prompted for the secrets marked sync: false.
services:
  - type: web
    name: storyforge
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "7860"
      - key: STORYFORGE_BACKEND
        value: gemini,groq
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: STORYFORGE_DAILY_LIVE_LIMIT
        value: "40"
      - key: JIRA_PROJECT_KEY
        value: SCRUM
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JIRA_BASE_URL
        sync: false
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: STORYFORGE_ADMIN_KEY
        generateValue: true
